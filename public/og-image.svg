  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#10b981" stroke-width="1">
    <path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200"/>
    <path d="M200 0v630M400 0v630M600 0v630M800 0v630M1000 0v630"/>
  </g>

  <!-- Scale / Balance Logo Icon -->
  <g transform="translate(920, 180)">
