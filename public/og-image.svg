    <path d="M90 40v100M65 140h50" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <path d="M50 65l40-10 40 10" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <!-- Left Pan -->
    <path d="M35 75l15-10 15 10" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 95c0 10 10 15 10 15s10-5 10-15" stroke="#10b981" stroke-width="5" fill="#064e3b" fill-opacity="0.6"/>
    <path d="M40 95l-5-20M60 95l5-20" stroke="#34d399" stroke-width="3"/>
    <!-- Right Pan -->
    <path d="M105 75l15-10 15 10" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 95c0 10 10 15 10 15s10-5 10-15" stroke="#10b981" stroke-width="5" fill="#064e3b" fill-opacity="0.6"/>
    <path d="M110 95l-5-20M130 95l5-20" stroke="#34d399" stroke-width="3"/>
    <circle cx="90" cy="55" r="7" fill="#34d399"/>
  </g>

  <!-- Badges -->
  <g transform="translate(100, 100)">
    <rect width="360" height="42" rx="21" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="27" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">🇩🇿 المنظومة رقم 1 لإدارة الديون في الجزائر</text>
  </g>

  <!-- Titles -->
