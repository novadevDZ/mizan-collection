  <text x="100" y="295" fill="url(#primary)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="bold" direction="rtl">استرجع أموالك وديونك بذكاء وسرعة</text>
  
  <text x="100" y="370" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="normal" direction="rtl">حل متكامل للموزعين وتجار الجملة والشركات في الجزائر</text>
  <text x="100" y="415" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" direction="rtl">• رسائل تحصيل ذكية عبر واتساب و SMS  • ربط BaridiMob و CCP</text>
