  <!-- Bottom Bar -->
  <rect x="100" y="520" width="1000" height="2" fill="#334155"/>
  <text x="100" y="565" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">mizan-collection.onrender.com</text>
  <text x="1100" y="565" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="18" text-anchor="end">برنامج إدارة ومتابعة ديون العملاء B2B بالدينار الجزائري (DZD)</text>
